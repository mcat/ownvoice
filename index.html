<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Belt-and-suspenders for the edge 301: if the iPad lands on apex
      // via a cached HTML page or a stale SW registered before the 301
      // was configured, the page stays on apex while relative asset
      // requests get 301'd to www — so `import.meta.url` (and any URL
      // resolved through it) ends up www-prefixed against an apex page,
      // tripping CORP=same-origin on /assets/*. Synchronously bouncing
      // here avoids running any module code on apex.
      if (location.hostname === "ownvoice.icu") {
        location.replace(
          "https://www.ownvoice.icu" + location.pathname + location.search + location.hash,
        );
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FAFAF8" />
    <link rel="canonical" href="https://www.ownvoice.icu/" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%232563EB'/><text x='16' y='23' font-size='20' text-anchor='middle' fill='white'>V</text></svg>" />
    <title>OwnVoice — In-patient AAC with personal voice</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main-homepage.tsx"></script>
  </body>
</html>
