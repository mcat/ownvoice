<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Belt-and-suspenders for the edge 301: if the iPad lands on apex
      // via a cached HTML page or a stale SW registered before the 301
      // was configured, the page stays on apex while relative asset
      // requests get 301'd to www — so `import.meta.url` (and any URL
      // resolved through it) ends up www-prefixed against an apex page,
      // tripping CORP=same-origin on /assets/*. Synchronously bouncing
      // here avoids running any module code on apex (and lets the SW
      // register on the canonical origin).
      if (location.hostname === "ownvoice.icu") {
        location.replace(
          "https://www.ownvoice.icu" + location.pathname + location.search + location.hash,
        );
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="OwnVoice" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no, address=no, email=no, date=no" />
    <meta name="theme-color" content="#FAFAF8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)" />
    <!--
      Defense-in-depth for crossOriginIsolated. COOP cannot be set via meta
      (HTTP header only — dev server + sw.js handle that), but COEP can, and
      a missing COEP header is the more common failure mode on static hosts.
      This tag ensures the document is COEP-gated even if the serving layer
      forgets the header.
    -->
    <meta http-equiv="Cross-Origin-Embedder-Policy" content="credentialless" />
    <link rel="canonical" href="https://www.ownvoice.icu/app/" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />

    <!--
      iPad Pro M4/M5 splash screens. Filename encodes device-pixel resolution
      (the rendered file dimensions); media queries use the device's NATURAL
      portrait CSS dimensions (iOS reports device-width/device-height in the
      device's natural orientation regardless of current rotation), with
      `orientation` selecting between landscape and portrait variants.
    -->
    <link rel="apple-touch-startup-image" href="/splash/launch-1668x2420-light.png"
          media="(device-width: 834px) and (device-height: 1210px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait) and (prefers-color-scheme: light)" />
    <link rel="apple-touch-startup-image" href="/splash/launch-1668x2420-dark.png"
          media="(device-width: 834px) and (device-height: 1210px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait) and (prefers-color-scheme: dark)" />
    <link rel="apple-touch-startup-image" href="/splash/launch-2420x1668-light.png"
          media="(device-width: 834px) and (device-height: 1210px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape) and (prefers-color-scheme: light)" />
    <link rel="apple-touch-startup-image" href="/splash/launch-2420x1668-dark.png"
          media="(device-width: 834px) and (device-height: 1210px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape) and (prefers-color-scheme: dark)" />
    <link rel="apple-touch-startup-image" href="/splash/launch-2064x2752-light.png"
          media="(device-width: 1032px) and (device-height: 1376px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait) and (prefers-color-scheme: light)" />
    <link rel="apple-touch-startup-image" href="/splash/launch-2064x2752-dark.png"
          media="(device-width: 1032px) and (device-height: 1376px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait) and (prefers-color-scheme: dark)" />
    <link rel="apple-touch-startup-image" href="/splash/launch-2752x2064-light.png"
          media="(device-width: 1032px) and (device-height: 1376px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape) and (prefers-color-scheme: light)" />
    <link rel="apple-touch-startup-image" href="/splash/launch-2752x2064-dark.png"
          media="(device-width: 1032px) and (device-height: 1376px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape) and (prefers-color-scheme: dark)" />
    <title>OwnVoice</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main-app.tsx"></script>
    <script>
      // Only register SW in production builds — in dev it caches stale worker bundles
      if ("serviceWorker" in navigator && !window.location.port) {
        navigator.serviceWorker.register("/sw.js", { scope: "/app/" });
      }
    </script>
  </body>
</html>
