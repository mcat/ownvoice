version: 2
updates:
  # npm — root package.json
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: scope
    ignore:
      # onnxruntime-web is pinned by ORT_VERSION in src/models/assetVersions.ts
      # because the version string is part of the R2 asset path (/ort/v<X>/*.wasm).
      # Bumping requires re-running `npm run assets:download && npm run assets:upload`,
      # so Dependabot must not auto-bump it.
      - dependency-name: "onnxruntime-web"
      # markdown-to-jsx 8/9 ship a custom vnode factory that builds React-shape
      # vnodes directly (with $$typeof = Symbol.for("react.element") and
      # _owner/_store/_debugStack fields) instead of going through the
      # framework's createElement. Preact's reconciler can't render those
      # because they lack Preact's internal vnode fields (__k, __b, __e, etc.),
      # so /research and /bibliography render as empty <article>s. Pin to v7
      # until upstream restores framework-aware vnode construction.
      - dependency-name: "markdown-to-jsx"
        versions: [">=8"]
    groups:
      # Dev deps batched into one weekly PR; production deps get individual PRs
      # so a regression in Preact / Zustand / ONNX-adjacent code is easy to bisect.
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  # GitHub Actions used by .github/workflows/*.yml
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(ci)"
      include: scope
